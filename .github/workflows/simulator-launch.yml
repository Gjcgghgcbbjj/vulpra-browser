name: Vulpra Real iOS Simulator Launch

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/vulpra-first-integration
    paths:
      - .github/workflows/simulator-launch.yml
      - App/**
      - Tools/Release/**

permissions:
  actions: read
  contents: read

jobs:
  launch:
    name: Build and launch the real Vulpra client
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      XCODE_APP: Xcode_26.4.1.app
      DERIVED_DATA: ${{ github.workspace }}/.build/simulator-derived

    steps:
      - name: Checkout Vulpra source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch "/Applications/$XCODE_APP/Contents/Developer"
          xcodebuild -version | tee simulator-environment.log
          xcrun --sdk iphonesimulator --show-sdk-build-version | tee -a simulator-environment.log
          xcrun simctl list runtimes | tee -a simulator-environment.log

      - name: Restore latest matching Gecko Simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          artifact_row="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("vulpra-gecko-simulator-"))) | [.created_at, .id, .name] | @tsv' \
            | LC_ALL=C sort -r | sed -n '1p')"
          artifact_id="$(printf '%s' "$artifact_row" | cut -f 2)"
          artifact_name="$(printf '%s' "$artifact_row" | cut -f 3)"
          test -n "$artifact_id"
          printf 'artifact_id=%s\nartifact_name=%s\n' "$artifact_id" "$artifact_name" | tee simulator-runtime.log
          stage="$(mktemp -d)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$stage/artifact.zip"
          unzip -q "$stage/artifact.zip" -d "$stage/payload"
          test -s "$stage/payload/gecko-simulator-runtime.tar.gz"
          mkdir -p Vendor/firefox
          tar -xzf "$stage/payload/gecko-simulator-runtime.tar.gz" -C Vendor/firefox
          test -s Vendor/firefox/obj-aarch64-apple-ios-sim/dist/bin/XUL

      - name: Materialize pinned Gecko headers and default theme
        shell: bash
        run: |
          set -euo pipefail
          # Try git submodule ref first; fall back to the pinned release tag.
          firefox_sha="$(git ls-tree HEAD Vendor/firefox 2>/dev/null | awk '{print $3}')"
          if [ -z "$firefox_sha" ]; then
            firefox_sha="$(cat Vendor/firefox-release.txt 2>/dev/null || echo '27b462b22705a8860f7ab0d33aa5b4b658ae5932')"
          fi
          test -n "$firefox_sha"
          echo "Using Firefox ref: $firefox_sha"
          source_tree="$(mktemp -d)"
          mkdir -p "$source_tree/toolkit/xre" "$source_tree/widget/uikit"
          curl --fail --location --retry 4 --silent --show-error \
            "https://raw.githubusercontent.com/mozilla-firefox/firefox/$firefox_sha/toolkit/xre/IOSBootstrap.h" \
            --output "$source_tree/toolkit/xre/IOSBootstrap.h"
          curl --fail --location --retry 4 --silent --show-error \
            "https://raw.githubusercontent.com/mozilla-firefox/firefox/$firefox_sha/widget/uikit/GeckoViewSwiftSupport.h" \
            --output "$source_tree/widget/uikit/GeckoViewSwiftSupport.h"
          patch -d "$source_tree" -p1 < Patches/toolkit/xre/IOSBootstrap.h.patch
          patch -d "$source_tree" -p1 < Patches/widget/uikit/GeckoViewSwiftSupport.h.patch
          patch -d "$source_tree" -p1 < Patches/widget/uikit/GeckoViewRuntimeSupport.h.patch

          include=Vendor/firefox/obj-aarch64-apple-ios-sim/dist/include/GeckoView
          mkdir -p "$include"
          while read -r source target; do
            destination="$include/$target"
            if [ -L "$destination" ]; then
              unlink "$destination"
            fi
            cp "$source_tree/$source" "$destination"
            test -s "$destination"
          done <<'EOF'
          toolkit/xre/IOSBootstrap.h IOSBootstrap.h
          widget/uikit/GeckoViewSwiftSupport.h GeckoViewSwiftSupport.h
          widget/uikit/GeckoViewRuntimeSupport.h GeckoViewRuntimeSupport.h
          EOF

          # Also copy patched headers into the source tree so Xcode's
          # PBXFileSystemSynchronizedGroup can see them as public headers
          # of the GeckoView framework target.
          runtime_headers=Extensions/GeckoView/Runtime
          mkdir -p "$runtime_headers"
          for h in IOSBootstrap.h GeckoViewSwiftSupport.h GeckoViewRuntimeSupport.h; do
            cp "$include/$h" "$runtime_headers/$h"
          done

          # The pbxproj PBXFileSystemSynchronizedRootGroup for "Gecko Runtime
          # Headers" points at the device dist path. Mirror headers there too
          # so Xcode can find them when building for simulator.
          device_include=Vendor/firefox/obj-aarch64-apple-ios/dist/include/GeckoView
          mkdir -p "$device_include"
          for h in IOSBootstrap.h GeckoViewSwiftSupport.h GeckoViewRuntimeSupport.h; do
            cp "$include/$h" "$device_include/$h"
          done

          theme=Vendor/firefox/toolkit/mozapps/extensions/default-theme
          mkdir -p "$theme"
          for name in icon.svg manifest.json preview.svg; do
            curl --fail --location --retry 4 --silent --show-error \
              "https://raw.githubusercontent.com/mozilla-firefox/firefox/$firefox_sha/toolkit/mozapps/extensions/default-theme/$name" \
              --output "$theme/$name"
            test -s "$theme/$name"
          done

      - name: Build the pinned idevice library for Simulator
        shell: bash
        run: |
          set -euo pipefail
          # Fallback: if git submodule ref is missing (orphan commit), clone directly.
          if ! git submodule update --init --depth 1 Vendor/idevice 2>/dev/null; then
            echo "Submodule ref missing, cloning idevice directly..."
            git clone --depth 1 https://github.com/jkcoxson/idevice.git Vendor/idevice
          fi
          ./Tools/Gecko/build-idevice.sh aarch64-apple-ios-sim 2>&1 | tee simulator-idevice.log
          PLATFORM_NAME=iphonesimulator ./Tools/Runtime/verify-runtime-artifacts.sh | tee simulator-runtime-verification.log
          PLATFORM_NAME=iphonesimulator ./Tools/Runtime/prepare-runtime-headers.sh | tee simulator-runtime-headers.log

      - name: Build the real Vulpra application for Simulator
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project Vulpra.xcodeproj \
            -scheme Vulpra \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee simulator-build.log
          test -d "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Vulpra.app"

      - name: Install, launch, and prove process survival
        shell: bash
        run: |
          set -euo pipefail
          app="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Vulpra.app"
          runtime="$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          values = [item for item in json.load(sys.stdin)["runtimes"] if item.get("isAvailable") and item.get("name", "").startswith("iOS")]
          if not values: raise SystemExit("no available iOS Simulator runtime")
          print(values[-1]["identifier"])
          ')"
          device_type="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          values = [item for item in json.load(sys.stdin)["devicetypes"] if item.get("name", "").startswith("iPhone")]
          if not values: raise SystemExit("no available iPhone Simulator device type")
          preferred = [item for item in values if "Pro" in item["name"]]
          print((preferred or values)[-1]["identifier"])
          ')"
          udid="$(xcrun simctl create "Vulpra-CI-$GITHUB_RUN_ID" "$device_type" "$runtime")"
          cleanup() { xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true; xcrun simctl delete "$udid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"

          {
            sudo -n /usr/sbin/DevToolsSecurity -enable
            sudo -n xcrun lldb --batch -o "version" -o "quit"
          } 2>&1 | tee simulator-lldb-warmup.log

          xcrun simctl launch --wait-for-debugger "$udid" com.vulpra.browser 2>&1 | tee simulator-launch.log
          pid="$(awk -F ': ' '/com\.vulpra\.browser:/ { print $2 }' simulator-launch.log | tail -n 1)"
          [[ "$pid" =~ ^[0-9]+$ ]]

          set +e
          sudo -n xcrun lldb --batch \
            -o "process attach --pid $pid" \
            -o 'script print("VULPRA_LLDB_ATTACHED", flush=True)' \
            -o "process handle -s true -n true -p false SIGSEGV" \
            -o "process handle -s true -n true -p false SIGABRT" \
            -o 'script import lldb; lldb.debugger.SetAsync(True)' \
            -o "continue" \
            -o 'script import lldb, time; time.sleep(20); p = lldb.debugger.GetSelectedTarget().GetProcess(); s = p.GetState(); r = s == lldb.eStateRunning; st = s == lldb.eStateStopped; print(f"VULPRA_LLDB_WAS_RUNNING={int(r)}", flush=True); print(f"VULPRA_LLDB_STOPPED={int(st)}", flush=True) if st else None; t = p.GetSelectedThread() if st else None; print(f"VULPRA_LLDB_STOP_REASON={t.GetStopDescription(200)}", flush=True) if t else None; [print(f"VULPRA_LLDB_FRAME_{i}={t.GetFrameAtIndex(i)}", flush=True) for i in range(min(20, t.GetNumFrames()))] if t else None; p.SendAsyncInterrupt() if r else None; [time.sleep(0.1) for _ in range(50) if p.GetState() == lldb.eStateRunning] if r else None' \
            -o "process detach" \
            2>&1 | tee simulator-lldb.log
          lldb_status=${PIPESTATUS[0]}
          set -e

          sleep 1
          xcrun simctl io "$udid" screenshot simulator-launch.png

          # ---------- UI tour: capture every main in-app screen ----------
          mkdir -p screenshots
          shot() { xcrun simctl io "$udid" screenshot "screenshots/$1.png" >/dev/null 2>&1 || true; }

          probe="$(mktemp /tmp/vulpra-probe.XXXXXX.png)"
          xcrun simctl io "$udid" screenshot "$probe" >/dev/null 2>&1 || true
          PT_W=440; PT_H=956
          if [ -s "$probe" ]; then
            read -r PT_W PT_H < <(python3 -c '
          import struct, sys
          with open(sys.argv[1], "rb") as handle:
              head = handle.read(24)
          width, height = struct.unpack(">II", head[16:24])
          print(width // 3, height // 3)' "$probe" 2>/dev/null || echo "440 956")
          fi
          rm -f "$probe"

          TAP_BACKEND=none
          if xcrun simctl ui "$udid" tap 3 3 >/dev/null 2>&1; then TAP_BACKEND=simctl; fi
          {
            if [ "$TAP_BACKEND" = none ]; then
              echo "probe: simctl ui tap unavailable, trying idb"
              (brew install idb-companion || brew install facebook/fb/idb-companion) 2>&1 | tail -2
              python3 -m pip install --quiet --user --break-system-packages fb-idb 2>&1 | tail -2 \
                || python3 -m pip install --quiet --user fb-idb 2>&1 | tail -2
              IDB_BIN="$(python3 -c 'import sysconfig, pathlib; print(pathlib.Path(sysconfig.get_path("scripts", "posix_user")))' 2>/dev/null || true)"
              export PATH="${IDB_BIN:-/nonexistent}:$HOME/.local/bin:$PATH"
              echo "idb_companion: $(command -v idb_companion || echo MISSING)"
              echo "idb: $(command -v idb || echo MISSING)"
              if command -v idb_companion >/dev/null 2>&1 && command -v idb >/dev/null 2>&1; then
                idb_companion --udid "$udid" --grpc-port 10003 >idb-companion.log 2>&1 &
                sleep 10
                idb connect "localhost:10003" 2>&1 | tail -1
                idb list-targets 2>&1 | head -3
                TAP_BACKEND=idb
              fi
            fi
            echo "TAP_BACKEND=$TAP_BACKEND PT=${PT_W}x${PT_H}"
          } 2>&1 | tee screenshots/tour.log
          tap() {
            if [ "$TAP_BACKEND" = simctl ]; then xcrun simctl ui "$udid" tap "$1" "$2" >/dev/null 2>&1 || true
            elif [ "$TAP_BACKEND" = idb ]; then idb ui tap --udid "$udid" "$1" "$2" >/dev/null 2>&1 || true
            fi
          }
          px() { echo $((PT_W * $1 / 100)); }
          py() { echo $((PT_H * $1 / 100)); }
          LAST_HASH=""
          shot() {
            xcrun simctl io "$udid" screenshot "screenshots/$1.png" >/dev/null 2>&1 || true
            hash="" && [ -f "screenshots/$1.png" ] && hash="$(md5 -q "screenshots/$1.png")"
            if [ "$hash" = "$LAST_HASH" ]; then echo "shot $1: UNCHANGED" >> screenshots/tour.log
            else echo "shot $1: changed" >> screenshots/tour.log; fi
            LAST_HASH="$hash"
          }

          set +e
          sleep 3
          shot 01-start-page

          # Start-page ⋯ menu: Private Tab / Bookmarks / History / Downloads / Settings
          tap "$(px 51)" "$(py 8)"
          sleep 2
          shot 02-start-menu
          tap "$(px 55)" "$(py 30)"; sleep 3; shot 03-settings
          tap "$(px 5)" "$(py 7)"; sleep 2
          tap "$(px 51)" "$(py 8)"; sleep 2
          tap "$(px 55)" "$(py 15)"; sleep 3; shot 04-library-bookmarks
          tap "$(px 5)" "$(py 7)"; sleep 2
          tap "$(px 51)" "$(py 8)"; sleep 2
          tap "$(px 55)" "$(py 25)"; sleep 3; shot 05-downloads
          tap "$(px 5)" "$(py 7)"; sleep 2

          # Tab overview via the capsule tabs button.
          tap "$(px 89)" "$(py 90)"; sleep 3
          shot 06-tab-overview
          tap "$(px 6)" "$(py 7)"; sleep 2

          # Keyboard over the start-page search field.
          tap "$(px 30)" "$(py 26)"; sleep 2
          shot 07-start-keyboard
          tap "$(px 50)" "$(py 55)"; sleep 1

          # Real web page through the URL scheme (confirm the system hand-off dialog).
          xcrun simctl openurl "$udid" "vulpra://open?url=https%3A%2F%2Fexample.com" >/dev/null 2>&1 || true
          sleep 3
          tap "$(px 69)" "$(py 53)"
          sleep 10
          shot 08-web-page

          # Dark-mode smoke on the web screen.
          xcrun simctl ui "$udid" appearance dark >/dev/null 2>&1 || true
          sleep 2
          shot 09-web-dark
          xcrun simctl ui "$udid" appearance light >/dev/null 2>&1 || true
          ls -la screenshots | tee -a screenshots/tour.log
          set -e

          set +e
          xcrun simctl terminate "$udid" com.vulpra.browser 2>&1 | tee simulator-terminate.log
          terminate_status=${PIPESTATUS[0]}
          set -e
          xcrun simctl spawn "$udid" log show \
            --last 3m --style compact --info --debug \
            --predicate 'process == "Vulpra" OR senderImagePath CONTAINS[c] "Vulpra" OR eventMessage CONTAINS[c] "Vulpra" OR eventMessage CONTAINS[c] "com.vulpra.browser"' \
            > simulator-system.log 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" -type f \
            \( -name 'Vulpra*.crash' -o -name 'Vulpra*.ips' \) -mmin -10 \
            -exec cp {} . \; 2>/dev/null || true
          if ! grep -Fq 'VULPRA_LLDB_ATTACHED' simulator-lldb.log; then
            echo "LLDB never attached to Vulpra (status=$lldb_status)" >&2
            exit 1
          fi
          if grep -Eq 'stop reason = .*SIGSEGV|EXC_BAD_ACCESS' simulator-lldb.log; then
            echo "Vulpra stopped under LLDB with a segmentation fault" >&2
            exit 1
          fi
          if ! grep -Fq 'VULPRA_LLDB_WAS_RUNNING=1' simulator-lldb.log; then
            echo "Vulpra was not running at the end of the LLDB survival window" >&2
            exit 1
          fi
          # Survival is authoritative. LLDB halt timeout while still running is not a crash.
          if grep -Fq 'VULPRA_LLDB_WAS_RUNNING=1' simulator-lldb.log; then
            echo "Vulpra survived the launch gate (lldb=$lldb_status terminate=$terminate_status)"
            exit 0
          fi
          echo "Vulpra did not survive the LLDB launch gate (lldb=$lldb_status terminate=$terminate_status)" >&2
          exit 1

      - name: Upload Simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulpra-simulator-launch-${{ github.run_id }}
          path: |
            simulator-*.log
            simulator-launch.png
            screenshots/
            idb-companion.log
            Vulpra*.crash
            Vulpra*.ips
          if-no-files-found: warn
          retention-days: 14
