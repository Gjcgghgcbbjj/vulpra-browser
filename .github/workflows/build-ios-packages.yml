name: Build Vulpra Independent IPA

on:
  workflow_dispatch:
    inputs:
      xcode_version:
        description: Xcode application installed on the runner
        required: true
        default: Xcode_26.4.1.app
        type: string
      engine_release_tag:
        description: Release containing the verified native Gecko v5 engine
        required: true
        default: vulpra-engine-v5-r0.1-candidate
        type: string

permissions:
  contents: read

concurrency:
  group: vulpra-independent-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile and package the independent browser
    runs-on: macos-26
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      XCODE_APP: ${{ inputs.xcode_version }}

    steps:
      - name: Checkout Vulpra source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected="/Applications/${XCODE_APP}"
          test -d "$selected"
          sudo xcode-select --switch "$selected/Contents/Developer"
          xcodebuild -version | tee build-environment.log
          xcrun --sdk iphoneos --show-sdk-build-version | tee -a build-environment.log

      - name: Restore verified native Gecko engine v5
        shell: bash
        run: |
          set -euo pipefail
          python3 - '${{ inputs.engine_release_tag }}' <<'PY' > engine-lock.env
          import json, shlex, sys
          lock = json.load(open('Configuration/engine-artifact-lock.json'))
          if sys.argv[1] != lock['releaseTag']:
              raise SystemExit('workflow release tag does not match engine-artifact-lock.json')
          values = {
              'ENGINE_RELEASE_TAG': lock['releaseTag'],
              'ENGINE_ARCHIVE': lock['device']['archive'],
              'ENGINE_ARCHIVE_SHA256': lock['device']['archiveSHA256'],
              'ENGINE_ARTIFACT_ID': lock['device']['artifactId'],
              'ENGINE_ABI_VERSION': lock['device']['abiVersion'],
              'ENGINE_SOURCE_COMMIT': lock['device']['sourceCommit'],
              'ENGINE_PRODUCER_RUN_ID': str(lock['producerRunId']),
              'ENGINE_PRODUCER_HEAD_SHA': lock['producerHeadSha'],
              'ENGINE_PATCH_SET_SHA256': lock['device']['patchSetSHA256'],
              'ENGINE_CONFIGURATION_SHA256': lock['device']['configurationSHA256'],
              'ENGINE_COMPILED_BY_RUN_ID': str(lock['device']['compiledByRunId']),
              'ENGINE_COMPILED_BY_HEAD_SHA': lock['device']['compiledByHeadSha'],
              'ENGINE_BUILD_FINGERPRINT': lock['device']['buildFingerprint'],
          }
          for key, value in values.items():
              print(f'{key}={shlex.quote(value)}')
          PY
          set -a
          source engine-lock.env
          set +a
          stage="$(mktemp -d)"
          gh release download "$ENGINE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ENGINE_ARCHIVE" \
            --dir "$stage"
          printf '%s  %s\n' "$ENGINE_ARCHIVE_SHA256" "$stage/$ENGINE_ARCHIVE" | shasum -a 256 -c -
          mkdir -p .build/engine
          tar -xzf "$stage/$ENGINE_ARCHIVE" -C .build/engine
          python3 Tools/Engine/verify-engine-artifact.py \
            --contract Configuration/engine-artifact-device-v5.json .build/engine \
            | tee engine-verification.log
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('.build/engine/manifest.json'))
          if manifest['artifactId'] != os.environ['ENGINE_ARTIFACT_ID']:
              raise SystemExit('engine artifact ID does not match repository lock')
          if manifest['abiVersion'] != os.environ['ENGINE_ABI_VERSION']:
              raise SystemExit('engine ABI version does not match repository lock')
          if manifest['source']['commit'] != os.environ['ENGINE_SOURCE_COMMIT']:
              raise SystemExit('engine source commit does not match repository lock')
          if manifest['producer']['workflowRunId'] != int(os.environ['ENGINE_PRODUCER_RUN_ID']):
              raise SystemExit('engine producer run does not match repository lock')
          if manifest['producer']['commit'] != os.environ['ENGINE_PRODUCER_HEAD_SHA']:
              raise SystemExit('engine producer snapshot does not match repository lock')
          if manifest['patchSet']['sha256'] != os.environ['ENGINE_PATCH_SET_SHA256']:
              raise SystemExit('engine patch set does not match repository lock')
          if manifest['configurationSHA256'] != os.environ['ENGINE_CONFIGURATION_SHA256']:
              raise SystemExit('engine producer configuration does not match repository lock')
          if manifest['compiledBy']['workflowRunId'] != int(os.environ['ENGINE_COMPILED_BY_RUN_ID']):
              raise SystemExit('engine compile run does not match repository lock')
          if manifest['compiledBy']['commit'] != os.environ['ENGINE_COMPILED_BY_HEAD_SHA']:
              raise SystemExit('engine compile snapshot does not match repository lock')
          if manifest['compiledBy']['buildFingerprint'] != os.environ['ENGINE_BUILD_FINGERPRINT']:
              raise SystemExit('engine build fingerprint does not match repository lock')
          PY

      - name: Run portable architecture gates
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/Build/generate-build-identity.py --check
          ./Tests/IndependentEngine/run-portable.sh | tee portable-independent.log
          ./Tests/RuntimeShell/run-portable.sh | tee portable-product.log
          ./Tests/Browser/run-portable.sh | tee portable-browser.log

      - name: Validate Xcode graph
        shell: bash
        run: xcodebuild -list -project Vulpra.xcodeproj 2>&1 | tee xcode-project-list.log

      - name: Install package signer
        shell: bash
        run: command -v ldid >/dev/null 2>&1 || brew install ldid

      - name: Build application archive
        shell: bash
        run: ./Tools/Release/build-app.sh 2>&1 | tee build-app.log

      - name: Create and validate packages
        shell: bash
        run: |
          set -euo pipefail
          ./Tools/Release/create-ipa.sh 2>&1 | tee create-ipa.log
          python3 Tools/Engine/validate-ipa.py dist/Vulpra.ipa | tee validate-ipa.log
          python3 Tools/Engine/validate-ipa.py --require-signatures \
            dist/Vulpra-TrollStore.tipa | tee validate-tipa.log
          (cd dist && shasum -a 256 -c SHA256SUMS)
          unzip -p dist/Vulpra.ipa Payload/Vulpra.app/Info.plist > packaged-app-info.plist
          test "$(plutil -extract CFBundleShortVersionString raw packaged-app-info.plist)" = \
            "$(python3 Tools/Build/generate-build-identity.py --print marketingVersion)"
          test "$(plutil -extract CFBundleVersion raw packaged-app-info.plist)" = \
            "$(python3 Tools/Build/generate-build-identity.py --print buildVersion)"
          test "$(plutil -extract VulpraUIBuildFingerprint raw packaged-app-info.plist)" = \
            "$(python3 Tools/Build/generate-build-identity.py --print uiFingerprint)"
          test "$(plutil -extract VulpraDistributionProfile raw packaged-app-info.plist)" = 'external-signing'
          unzip -p dist/Vulpra-TrollStore.tipa Payload/Vulpra.app/Info.plist > packaged-tipa-info.plist
          test "$(plutil -extract VulpraDistributionProfile raw packaged-tipa-info.plist)" = 'trollstore'

      - name: Upload installable packages
        uses: actions/upload-artifact@v4
        with:
          name: vulpra-independent-ios-${{ github.run_id }}
          path: |
            dist/Vulpra.ipa
            dist/Vulpra-TrollStore.tipa
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulpra-independent-logs-${{ github.run_id }}
          path: |
            *.log
            dist/Vulpra.xcarchive/Info.plist
          if-no-files-found: warn
          retention-days: 14
